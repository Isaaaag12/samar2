<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sam Sabueso - Escena del Crimen AR</title>
    <!-- Importamos A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- Escena de Realidad Aumentada -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <!-- Definimos tu marcador .patt -->
      <a-marker type="pattern" url="marcador.patt">
        
        <!-- 1. El Modelo 3D de Sam Sabueso -->
        <a-entity 
          gltf-model="3dmodel.glb" 
          position="0 0 0" 
          rotation="0 0 0"
          scale="0.5 0.5 0.5">
        </a-entity>

        <!-- 2. La imagen del equipo y la frase -->
        <a-image 
          src="imagen-equipo.png" 
          position="1.5 1 0" 
          width="2" height="1.2"
          rotation="-90 0 0">
        </a-image>

      </a-marker>

      <!-- Entidad de cámara -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
